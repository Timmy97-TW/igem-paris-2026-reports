title: Paris Grand Jamboree 2026 — the instructors' hub
description: Gabriel, Chars and Timmy at the iGEM Grand Jamboree in Paris — the four-day plan, the eight capabilities we are after, and the three reports that come back.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
exclude:
  - tools/
  - plan/
  - research/_slices/
  - data/teams_2026.json
  - data/schedule_2026.json
  - data/schedule_meta.json
  - data/event_2026.json
  - README.md
  - .gitignore
defaults:
  - scope: {path: ""}
    values: {layout: doc}

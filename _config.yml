title: Paris Grand Jamboree 2026 — the instructors' hub
title_alt: 2026 巴黎總決賽 · 帶隊老師主頁
description: Timmy, Chars and Gabriel at the iGEM Grand Jamboree in Paris — the four-day plan, the eight capabilities we want, and three reports.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
exclude:
  - tools/
  - plan/
  - research/_slices/
  - data/teams_2026.json
  - data/schedule_2026.json
  - data/schedule_meta.json
  - data/event_2026.json
  - README.md
  - .gitignore
defaults:
  - scope: {path: ""}
    values: {layout: doc}
